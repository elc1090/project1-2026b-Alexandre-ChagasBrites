<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Drawing Board</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <aside>
      <ul class="tools">
        <h2>Tools</h2>
        <li class="tool" id="selection">
          <img src="assets/selection.svg" alt="Selection">
          <span>Selection</span>
        </li>
        <li class="tool" id="brush">
          <img src="assets/brush.svg" alt="Brush">
          <span>Brush</span>
        </li>
        <li class="tool" id="spray">
          <img src="assets/spray.svg" alt="Spray">
          <span>Spray</span>
        </li>
        <li class="tool" id="eraser">
          <img src="assets/eraser.svg" alt="Eraser">
          <span>Eraser</span>
        </li>
        <li class="tool" id="eyedropper">
          <img src="assets/eyedropper.svg" alt="Eyedropper">
          <span>Eyedropper</span>
        </li>
        <li class="tool" id="line">
          <img src="assets/line.svg" alt="Line">
          <span>Line</span>
        </li>
        <li class="tool" id="rectangle">
          <img src="assets/rectangle.svg" alt="Rectangle">
          <span>Rectangle</span>
        </li>
        <li class="tool" id="circle">
          <img src="assets/circle.svg" alt="Circle">
          <span>Circle</span>
        </li>
        <li class="tool" id="polygon">
          <img src="assets/polygon.svg" alt="Polygon">
          <span>Polygon</span>
        </li>
        <li>
          <label for="lineWidth">Width:</label>
          <input type="range" id="lineWidth" value="4" min="1" max="64">
        </li>
        <li>
          <label for="fillPath">Fill:</label>
          <input type="checkbox" id="fillPath">
        </li>
      </ul>
      <h2>Colors</h2>
      <ul class="colors">
        <li style="background-color: white"></li>
        <li style="background-color: red"></li>
        <li style="background-color: orange"></li>
        <li style="background-color: yellow"></li>
        <li style="background-color: green"></li>
        <li style="background-color: cyan"></li>
        <li style="background-color: blue"></li>
        <li style="background-color: magenta"></li>
        <li style="background-color: black"></li>
      </ul>
      <p id="color">Color</p>
      <div>
        <h2>Canvas</h2>
        <label for="canvasWidth">Width:</label>
        <input type="number" id="canvasWidth" value="960" min="1" max="4096">
        <label for="canvasHeight">Height:</label>
        <input type="number" id="canvasHeight" value="540" min="1" max="4096">
      </div>
    </aside>
    <main>
        <canvas></canvas>
    </main>
  </body>
</html>
